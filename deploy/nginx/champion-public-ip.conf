# 放在 Nginx 的 http 配置下。按端口筛选 Cookie，并覆盖客户端传来的代理头。
map $http_upgrade $champion_connection { default upgrade; '' ''; }
map "$request_method:$http_accept" $champion_browser_navigation { default 0; ~^GET:.*text/html 1; }
log_format champion_public '$remote_addr [$time_local] "$request_method $uri" $status';
server {
    listen 443 ssl default_server;
    server_name 107.174.48.241;
    ssl_certificate /etc/letsencrypt/live/champion-erp-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/champion-erp-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/champion-erp-access.log champion_public;
    if ($host != 107.174.48.241) { return 444; }
    client_max_body_size 128m;
    location = /healthz { access_log off; return 204; }
    location ^~ /api/internal/ { return 404; }
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host 107.174.48.241;
    proxy_set_header Cookie "champion_session=$cookie_champion_session";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    location = /api/ai-config {
        gzip on;
        gzip_vary on;
        gzip_types application/json;
        gzip_min_length 1024;
        proxy_pass http://127.0.0.1:5050;
    }
    location / {
        if ($champion_browser_navigation) { return 302 https://hdgl.cc.cd$request_uri; }
        proxy_pass http://127.0.0.1:5050;
    }
}
server {
    listen 8443 ssl default_server;
    server_name 107.174.48.241;
    ssl_certificate /etc/letsencrypt/live/champion-erp-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/champion-erp-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/champion-newapi-access.log champion_public;
    if ($host != 107.174.48.241) { return 444; }
    client_max_body_size 128m;
    location ^~ /api/internal/ { return 404; }
    location ^~ /debug/ { return 404; }
    location / {
        if ($champion_browser_navigation) { return 302 https://hdgl.cc.cd:8443$request_uri; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host 107.174.48.241:8443;
        proxy_set_header Cookie "new_api_refresh=$cookie_new_api_refresh; new_api_has_session=$cookie_new_api_has_session; new_api_erp_flow=$cookie_new_api_erp_flow";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $champion_connection;
    }
}
