# Cloudflare 出口网段由部署时从官方 ips-v4 / ips-v6 清单生成。
server {
    listen 80;
    server_name hdgl.cc.cd;
    location ^~ /.well-known/acme-challenge/ { root /var/www/champion-acme; try_files $uri =404; }
    location / { return 308 https://hdgl.cc.cd$request_uri; }
}
server {
    listen 443 ssl;
    server_name hdgl.cc.cd;
    ssl_certificate /etc/letsencrypt/live/champion-erp-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/champion-erp-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != hdgl.cc.cd) { return 444; }
    include /etc/nginx/snippets/champion-cloudflare-realip.conf;
    access_log /var/log/nginx/champion-erp-access.log champion_public;
    client_max_body_size 128m;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host hdgl.cc.cd;
    proxy_set_header Cookie "champion_session=$cookie_champion_session";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    location = /healthz { access_log off; return 204; }
    location ^~ /api/internal/ { return 404; }
    location ^~ /assets/ {
        # 直接提供 Vite 的公开带哈希文件，私有业务文件走 ERP 鉴权。
        root /opt/champion-erp/current/erp_web/static/dist;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /api/ai-config {
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types application/json;
        proxy_pass http://127.0.0.1:5050;
    }
    location / { proxy_pass http://127.0.0.1:5050; }
}
server {
    listen 8443 ssl;
    server_name hdgl.cc.cd;
    ssl_certificate /etc/letsencrypt/live/champion-erp-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/champion-erp-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != hdgl.cc.cd) { return 444; }
    include /etc/nginx/snippets/champion-cloudflare-realip.conf;
    access_log /var/log/nginx/champion-newapi-access.log champion_public;
    client_max_body_size 128m;
    location ^~ /api/internal/ { return 404; }
    location ^~ /debug/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host hdgl.cc.cd:8443;
        proxy_set_header Cookie "new_api_refresh=$cookie_new_api_refresh; new_api_has_session=$cookie_new_api_has_session; new_api_erp_flow=$cookie_new_api_erp_flow";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $champion_connection;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }
}
