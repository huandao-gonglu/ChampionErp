<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champion 图片编辑</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.6 system-ui, sans-serif; }
  body { max-width: 720px; margin: 40px auto; padding: 0 24px; }
  h1 { font-size: 28px; margin-bottom: 8px; }
  label { display: block; margin-top: 20px; font-weight: 600; }
  input, textarea, button { box-sizing: border-box; font: inherit; }
  input, textarea { width: 100%; margin-top: 8px; }
  textarea { min-height: 110px; padding: 12px; border-radius: 8px; }
  button { margin-top: 20px; padding: 10px 24px; cursor: pointer; }
  button:disabled { cursor: wait; }
  img { display: block; max-width: 100%; margin-top: 24px; border-radius: 8px; }
  #status { min-height: 26px; }
  #download { display: inline-block; margin-top: 12px; }
  [hidden] { display: none !important; }
</style>
<h1>Champion 图片编辑</h1>
<p>选择图片，描述你希望修改的内容。</p>
<form id="editor">
  <label for="source">原图</label>
  <input id="source" type="file" accept="image/png,image/jpeg,image/webp" required>
  <label for="prompt">修改要求</label>
  <textarea id="prompt" placeholder="例如：将红色区域改成蓝色，保持其他内容不变" required></textarea>
  <button id="submit" type="submit">开始修改</button>
</form>
<p id="status" role="status" aria-live="polite">准备就绪。</p>
<img id="result" alt="修改后的图片" hidden>
<a id="download" download="edited-image.png" hidden>下载图片</a>
<script>
  // 只在用户提交时请求模型，不自动上传、生成或保存到外部服务。
  const IMAGE_MODEL = 'gemini-3.1-flash-image-preview';
  const form = document.getElementById('editor');
  const status = document.getElementById('status');
  const submit = document.getElementById('submit');
  const result = document.getElementById('result');
  const download = document.getElementById('download');

  function readImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1]);
      reader.onerror = () => reject(new Error('原图读取失败，请重新选择。'));
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (submit.disabled) return;
    const file = document.getElementById('source').files[0];
    const prompt = document.getElementById('prompt').value.trim();
    if (!file || !prompt) return;
    if (!['image/png', 'image/jpeg', 'image/webp'].includes(file.type) || file.size > 20 * 1024 * 1024) {
      status.textContent = '请选择不超过 20 MB 的 PNG、JPEG 或 WebP 图片。';
      return;
    }
    submit.disabled = true;
    result.hidden = download.hidden = true;
    status.textContent = '正在修改，请稍候…';
    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${IMAGE_MODEL}:generateContent?key=`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }, { inlineData: { mimeType: file.type, data: await readImage(file) } }] }],
            generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
          })
        }
      );
      const data = await response.json();
      if (!response.ok || data.error) throw new Error(data.error?.message || `请求失败（${response.status}）`);
      const parts = (data.candidates || []).flatMap(candidate => candidate.content?.parts || []);
      const image = parts.map(part => part.inlineData || part.inline_data)
        .find(part => part?.data && ['image/png', 'image/jpeg', 'image/webp'].includes(part.mimeType || part.mime_type));
      if (!image) throw new Error('本次未返回图片，请检查修改要求或当前使用限额。');
      const mime = image.mimeType || image.mime_type;
      result.src = download.href = `data:${mime};base64,${image.data}`;
      download.download = `edited-image.${{ 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' }[mime]}`;
      result.hidden = download.hidden = false;
      status.textContent = '修改完成。';
    } catch (error) {
      status.textContent = `修改未完成：${error.message}`;
    } finally {
      submit.disabled = false;
    }
  });
</script>
</html>
